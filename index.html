        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --secondary: #ff00ff;
            --accent: #ffea00;
            --dark: #0a0e27;
            --darker: #050815;
            --card-bg: rgba(15, 23, 42, 0.95);
            --glow: rgba(0, 212, 255, 0.4);
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--darker);
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, var(--darker) 0%, var(--dark) 100%);
            z-index: -1;
        }

        .header {
            text-align: center;
            padding: 3rem 2rem;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(255, 0, 255, 0.1) 100%);
            border-bottom: 2px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 10px var(--glow)); }
            50% { filter: drop-shadow(0 0 20px var(--glow)) drop-shadow(0 0 30px var(--glow)); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--primary);
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .search-section {
            margin-bottom: 2rem;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-size: 1.1rem;
            background: var(--card-bg);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            font-family: 'Exo 2', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 30px var(--glow);
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .role-filter {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .role-btn {
            padding: 0.8rem 1.5rem;
            background: var(--card-bg);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .role-btn:hover, .role-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--glow);
            transform: translateY(-2px);
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .hero-card {
            background: var(--card-bg);
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(255, 0, 255, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .hero-card:hover::before {
            opacity: 1;
        }

        .hero-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 40px var(--glow);
        }

        .hero-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        .hero-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .hero-role {
            font-size: 0.85rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .result-section {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 2.5rem;
            margin-top: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 50px var(--glow);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .result-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .counters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .counter-card {
            background: rgba(0, 212, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .counter-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 25px var(--glow);
            transform: translateX(5px);
        }

        .counter-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .counter-reason {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        .build-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid rgba(0, 212, 255, 0.3);
        }

        .build-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--secondary);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .build-grid {
            display: grid;
            gap: 1rem;
        }

        .build-item {
            background: rgba(255, 0, 255, 0.05);
            border: 2px solid rgba(255, 0, 255, 0.3);
            border-radius: 12px;
            padding: 1.2rem;
        }

        .build-item-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .build-item-desc {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }

        .tips-section {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 234, 0, 0.05);
            border: 2px solid rgba(255, 234, 0, 0.3);
            border-radius: 15px;
        }

        .tips-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tips-list {
            list-style: none;
            padding: 0;
        }

        .tips-list li {
            padding: 0.7rem 0;
            padding-left: 1.5rem;
            position: relative;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
        }

        .tips-list li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .heroes-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }

            .counters-grid {
                grid-template-columns: 1fr;
            }

            .result-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>

        const searchBox = document.getElementById('searchBox');
        const resultSection = document.getElementById('resultSection');
        const roleButtons = document.querySelectorAll('.role-btn');
        
        let currentRole = 'all';
        let searchQuery = '';

        function renderHeroes() {
            const filteredHeroes = Object.entries(heroesData).filter(([name, data]) => {
                const matchRole = currentRole === 'all' || data.role === currentRole;
                const matchSearch = name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchRole && matchSearch;
            });

            heroesGrid.innerHTML = filteredHeroes.map(([name, data]) => `
                <div class="hero-card" onclick="showCounters('${name}')">
                    <div class="hero-icon">${name.charAt(0)}</div>
                    <div class="hero-name">${name}</div>
                    <div class="hero-role">${data.role}</div>
                </div>
            `).join('');

            if (filteredHeroes.length === 0) {
                heroesGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: rgba(255,255,255,0.5); padding: 2rem;">Tidak ada hero ditemukan</p>';
            }
        }

        function showCounters(heroName) {
            const hero = heroesData[heroName];
            
            resultSection.innerHTML = `
                <div class="result-header">
                    <h2>Counter untuk ${heroName}</h2>
                    <p style="color: var(--primary); margin-top: 0.5rem;">Role: ${hero.role.toUpperCase()}</p>
                </div>

                <div class="counters-grid">
                    ${hero.counters.map(counter => `
                        <div class="counter-card">
                            <div class="counter-name">🎯 ${counter.name}</div>
                            <div class="counter-reason">${counter.reason}</div>
                        </div>
                    `).join('')}
                </div>

                <div class="build-section">
                    <h3 class="build-title">⚔️ Build Item Melawan ${heroName}</h3>
                    <div class="build-grid">
                        <div>
                            <h4 style="color: var(--accent); margin-bottom: 1rem; font-size: 1.1rem;">Core Items:</h4>
                            ${hero.build.core.map(item => `
                                <div class="build-item">
                                    <div class="build-item-name">${item.name}</div>
                                    <div class="build-item-desc">${item.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div>
                            <h4 style="color: var(--accent); margin-bottom: 1rem; font-size: 1.1rem;">Situational Items:</h4>
                            ${hero.build.situational.map(item => `
                                <div class="build-item">
                                    <div class="build-item-name">${item.name}</div>
                                    <div class="build-item-desc">${item.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <div class="tips-section">
                    <div class="tips-title">💡 Tips Menghadapi ${heroName}</div>
                    <ul class="tips-list">
                        ${hero.tips.map(tip => `<li>${tip}</li>`).join('')}
                    </ul>
                </div>
            `;
            
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        searchBox.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderHeroes();
        });

        roleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                roleButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRole = btn.dataset.role;
                renderHeroes();
            });
        });
